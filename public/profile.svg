<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Sky & Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7EA6C8"/>
      <stop offset="35%" stop-color="#B8D3E5"/>
      <stop offset="60%" stop-color="#E2EDF4"/>
      <stop offset="100%" stop-color="#EDE6D8"/>
    </linearGradient>

    <linearGradient id="rockGradFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9CBB7"/>
      <stop offset="60%" stop-color="#CBBCA5"/>
      <stop offset="100%" stop-color="#B3A28A"/>
    </linearGradient>

    <linearGradient id="rockGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8DEC9"/>
      <stop offset="50%" stop-color="#D3C3A8"/>
      <stop offset="100%" stop-color="#B8A485"/>
    </linearGradient>

    <linearGradient id="rockGradNear" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2E9D8"/>
      <stop offset="60%" stop-color="#DECDB4"/>
      <stop offset="100%" stop-color="#BAA586"/>
    </linearGradient>

    <!-- Face & Skin Tone -->
    <linearGradient id="skinBase" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#FFE4D2"/>
      <stop offset="40%" stop-color="#F7CEB4"/>
      <stop offset="85%" stop-color="#E5AD8F"/>
      <stop offset="100%" stop-color="#CB9273"/>
    </linearGradient>

    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4997A"/>
      <stop offset="100%" stop-color="#B87B5B"/>
    </linearGradient>

    <!-- Cap Gradients -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F5F5F3"/>
      <stop offset="80%" stop-color="#DFE0DC"/>
      <stop offset="100%" stop-color="#C5C7C1"/>
    </linearGradient>

    <linearGradient id="capBrimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECEEE9"/>
      <stop offset="60%" stop-color="#D5D7D1"/>
      <stop offset="100%" stop-color="#B4B7AE"/>
    </linearGradient>

    <!-- Sunglasses Lens Gradient -->
    <linearGradient id="sunglassesLens" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#2D333B"/>
      <stop offset="25%" stop-color="#1B2026"/>
      <stop offset="70%" stop-color="#0E1217"/>
      <stop offset="100%" stop-color="#06080A"/>
    </linearGradient>

    <linearGradient id="lensReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8EA7B8" stop-opacity="0.5"/>
      <stop offset="35%" stop-color="#556F82" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Shirt Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#363A37"/>
      <stop offset="40%" stop-color="#272B28"/>
      <stop offset="100%" stop-color="#181A18"/>
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A412F"/>
      <stop offset="50%" stop-color="#3D291D"/>
      <stop offset="100%" stop-color="#22150D"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="capShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#5A3A25" flood-opacity="0.32"/>
    </filter>
    
    <filter id="glassesShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#402518" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= 1. BACKGROUND: CAPPADOCIA LANDSCAPE ================= -->
  <!-- Sky -->
  <rect width="800" height="800" fill="url(#skyGrad)"/>

  <!-- Distant Mountain Ridge -->
  <path d="M0,170 Q120,135 240,160 T480,145 T720,165 L800,180 L800,800 L0,800 Z" fill="#C5BAA8" opacity="0.75"/>

  <!-- Mid-distance Cappadocia Valleys & Fairy Chimney Rock Formations -->
  <g id="cappadocia-valleys" opacity="0.9">
    <!-- Rock Ridge 1 -->
    <path d="M0,220 C80,190 140,230 220,200 C300,170 380,240 480,210 C580,180 680,230 800,205 L800,500 L0,500 Z" fill="url(#rockGradFar)"/>
    
    <!-- Fairy Chimneys & Valleys Left -->
    <path d="M40,240 Q60,180 85,240 Q110,210 130,260 Q160,200 190,270 L0,360 L0,240 Z" fill="url(#rockGradMid)"/>
    <path d="M55,185 Q65,175 75,185 L70,220 L60,220 Z" fill="#998670"/> <!-- chimney cone cap -->
    <path d="M155,200 Q165,190 175,200 L170,240 L160,240 Z" fill="#998670"/>

    <!-- Fairy Chimneys & Valleys Right -->
    <path d="M600,240 Q640,180 670,240 Q710,195 750,250 Q780,220 800,250 L800,400 L560,340 Z" fill="url(#rockGradMid)"/>
    <path d="M635,180 Q645,170 655,180 L650,210 L640,210 Z" fill="#998670"/>
    <path d="M705,195 Q715,185 725,195 L720,230 L710,230 Z" fill="#998670"/>

    <!-- Green foliage in valleys (Kapadokya trees & bushes) -->
    <path d="M520,310 C550,295 580,315 610,300 C640,290 680,320 710,305 L720,340 L510,340 Z" fill="#586E48" opacity="0.85"/>
    <circle cx="540" cy="305" r="14" fill="#4B603D"/>
    <circle cx="570" cy="300" r="16" fill="#3D5030"/>
    <circle cx="630" cy="310" r="15" fill="#4B603D"/>
    <circle cx="670" cy="305" r="18" fill="#3D5030"/>
    <circle cx="100" cy="330" r="16" fill="#445936"/>
    <circle cx="130" cy="325" r="14" fill="#536943"/>

    <!-- Foreground Cappadocia Tufa Formations (White/Cream wave dunes) -->
    <path d="M0,350 Q100,280 200,330 T400,310 T600,350 T800,300 L800,800 L0,800 Z" fill="url(#rockGradNear)"/>
    <!-- Erosion wave striations -->
    <path d="M-20,400 Q150,330 320,390 Q500,340 820,410" fill="none" stroke="#D3C1A5" stroke-width="6" opacity="0.7"/>
    <path d="M-20,460 Q200,380 400,450 Q620,390 820,470" fill="none" stroke="#C4B093" stroke-width="5" opacity="0.7"/>
    <path d="M-20,530 Q220,440 450,520 Q660,450 820,540" fill="none" stroke="#BAA385" stroke-width="7" opacity="0.6"/>

    <!-- Vegetation bushes near bottom left -->
    <g id="near-foliage-left">
      <path d="M-10,610 Q20,550 50,600 Q70,540 100,590 Q120,530 140,610 L160,800 L-20,800 Z" fill="#526543"/>
      <path d="M10,590 Q35,530 65,580 Q85,520 115,570" fill="none" stroke="#6F865D" stroke-width="4"/>
    </g>
  </g>

  <!-- ================= 2. GÖRKEM PORTRAIT (MATCHING USER PHOTO) ================= -->
  <g id="gorkem-portrait" transform="translate(400, 480)">

    <!-- Shoulder / Body (Taking Selfie) -->
    <!-- Dark Charcoal Crewneck T-Shirt -->
    <path d="M -300,290 C -270,160 -180,120 -60,110 L 60,110 C 180,120 270,160 300,290 L 320,360 L -320,360 Z" fill="url(#shirtGrad)"/>
    
    <!-- T-Shirt Collar Ribbing -->
    <path d="M -68,110 C -45,145 45,145 68,110 C 50,155 -50,155 -68,110 Z" fill="#242724"/>
    <path d="M -70,110 C -45,148 45,148 70,110" fill="none" stroke="#454A45" stroke-width="3"/>

    <!-- Neck & Throat -->
    <path d="M -60,-10 L -60,120 C -20,135 20,135 60,120 L 60,-10 Z" fill="url(#skinBase)"/>
    <!-- Neck shadow under chin -->
    <path d="M -58,0 C -30,65 30,65 58,0 L 50,55 C 20,70 -20,70 -50,55 Z" fill="url(#skinShadow)" opacity="0.75"/>
    <path d="M -15,50 L 0,80 L 15,50" fill="none" stroke="#B87B5B" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Back hair / Hair behind neck -->
    <path d="M -115,-40 C -125,50 -95,90 -65,100 L -60,40 Z" fill="url(#hairGrad)"/>
    <path d="M 115,-40 C 125,50 95,90 65,100 L 60,40 Z" fill="url(#hairGrad)"/>
    <!-- Fine hair strands around neck -->
    <path d="M -110,10 Q -130,50 -105,75" fill="none" stroke="#483324" stroke-width="3"/>
    <path d="M 110,10 Q 130,50 105,75" fill="none" stroke="#483324" stroke-width="3"/>

    <!-- Ears -->
    <!-- Left Ear -->
    <path d="M -118,-60 C -138,-60 -140,5 -110,15 C -105,5 -105,-40 -115,-60 Z" fill="#F0C0A8"/>
    <path d="M -122,-40 C -130,-30 -130,-5 -118,2" fill="none" stroke="#D1987F" stroke-width="3"/>
    
    <!-- Right Ear -->
    <path d="M 118,-60 C 138,-60 140,5 110,15 C 105,5 105,-40 115,-60 Z" fill="#E8B59D"/>
    <path d="M 122,-40 C 130,-30 130,-5 118,2" fill="none" stroke="#C98F76" stroke-width="3"/>

    <!-- Main Face Shape (Oval / Soft Square Jaw) -->
    <path d="M -112,-80 C -112,40 -90,95 -45,120 C -20,132 20,132 45,120 C 90,95 112,40 112,-80 Z" fill="url(#skinBase)"/>

    <!-- Subtle stubble & jawline shading -->
    <path d="M -45,118 C -20,128 20,128 45,118 C 30,125 -30,125 -45,118 Z" fill="#91644A" opacity="0.3"/>
    <ellipse cx="0" cy="112" rx="35" ry="12" fill="#BA896E" opacity="0.18"/>

    <!-- Cheek & Smile Contours -->
    <path d="M -68,25 C -55,50 -45,70 -35,80" fill="none" stroke="#DE9F80" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M 68,25 C 55,50 45,70 35,80" fill="none" stroke="#DE9F80" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

    <!-- Nose -->
    <g id="nose">
      <path d="M -5,-15 L -8,32 C -18,36 -22,46 -14,52 C -4,56 4,56 14,52 C 22,46 18,36 8,32 L 5,-15" fill="none" stroke="#D19375" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Nostrils -->
      <ellipse cx="-12" cy="48" rx="4" ry="2.5" fill="#8C5338"/>
      <ellipse cx="12" cy="48" rx="4" ry="2.5" fill="#8C5338"/>
      <!-- Nose tip highlight -->
      <ellipse cx="0" cy="42" rx="7" ry="5" fill="#FFEFE5" opacity="0.5"/>
    </g>

    <!-- Friendly Smile / Lips -->
    <g id="mouth">
      <!-- Upper Lip -->
      <path d="M -40,78 Q -18,72 0,75 Q 18,72 40,78 C 22,81 0,82 -40,78 Z" fill="#B86F58"/>
      <!-- Smile line / closed lips parting with slight teeth/dimple curve -->
      <path d="M -44,76 Q -20,83 0,83 Q 20,83 44,76" fill="none" stroke="#7A3926" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Lower Lip -->
      <path d="M -32,80 Q 0,96 32,80 Q 0,88 -32,80 Z" fill="#D68A74"/>
      <!-- Subtle chin cleft shadow -->
      <path d="M -12,102 Q 0,105 12,102" fill="none" stroke="#C28769" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- Sideburns & Temple Hair -->
    <path d="M -112,-85 C -105,-40 -105,-15 -112,0 L -116,-5 C -116,-40 -115,-70 -112,-85 Z" fill="url(#hairGrad)"/>
    <path d="M 112,-85 C 105,-40 105,-15 112,0 L 116,-5 C 116,-40 115,-70 112,-85 Z" fill="url(#hairGrad)"/>

    <!-- ================= 3. ROUND SUNGLASSES ================= -->
    <g id="sunglasses" filter="url(#glassesShadow)">
      <!-- Bridge between lenses -->
      <path d="M -16,-12 Q 0,-18 16,-12" fill="none" stroke="#2B2D30" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M -16,-12 Q 0,-18 16,-12" fill="none" stroke="#8C939E" stroke-width="2" stroke-linecap="round"/>

      <!-- Temple Arms connecting to ears -->
      <path d="M -90,-10 L -120,-30" fill="none" stroke="#2B2D30" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 90,-10 L 120,-30" fill="none" stroke="#2B2D30" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Left Lens (Viewer's Left) -->
      <g id="left-lens">
        <!-- Outer Rim Frame -->
        <circle cx="-52" cy="-8" r="44" fill="#181A1D" stroke="#383C42" stroke-width="4"/>
        <!-- Dark Tinted Lens -->
        <circle cx="-52" cy="-8" r="41" fill="url(#sunglassesLens)"/>
        <!-- Outdoor Sky/Landscape Reflection inside Lens -->
        <path d="M -85,-22 C -65,-40 -35,-35 -20,-15 C -25,10 -45,25 -75,20 Z" fill="url(#lensReflection)"/>
        <!-- High Gloss Hotspot Reflection -->
        <ellipse cx="-64" cy="-24" rx="14" ry="7" transform="rotate(-30, -64, -24)" fill="#FFFFFF" opacity="0.35"/>
        <circle cx="-42" cy="-32" r="3" fill="#FFFFFF" opacity="0.4"/>
      </g>

      <!-- Right Lens (Viewer's Right) -->
      <g id="right-lens">
        <!-- Outer Rim Frame -->
        <circle cx="52" cy="-8" r="44" fill="#181A1D" stroke="#383C42" stroke-width="4"/>
        <!-- Dark Tinted Lens -->
        <circle cx="52" cy="-8" r="41" fill="url(#sunglassesLens)"/>
        <!-- Outdoor Sky/Landscape Reflection inside Lens -->
        <path d="M 20,-15 C 35,-35 65,-40 85,-22 C 75,20 45,25 25,10 Z" fill="url(#lensReflection)"/>
        <!-- High Gloss Hotspot Reflection -->
        <ellipse cx="40" cy="-24" rx="14" ry="7" transform="rotate(-30, 40, -24)" fill="#FFFFFF" opacity="0.35"/>
        <circle cx="62" cy="-32" r="3" fill="#FFFFFF" opacity="0.4"/>
      </g>
    </g>

    <!-- ================= 4. WHITE BASEBALL CAP ================= -->
    <g id="white-cap">
      <!-- Cast Shadow from Cap Brim onto Forehead -->
      <path d="M -110,-75 Q 0,-30 110,-75 L 110,-45 Q 0,0 -110,-45 Z" fill="#422517" opacity="0.45" filter="url(#capShadow)"/>

      <!-- Cap Crown / Panels (Dome) -->
      <path d="M -125,-85 C -135,-210 -70,-260 0,-265 C 70,-260 135,-210 125,-85 C 90,-115 -90,-115 -125,-85 Z" fill="url(#capGrad)"/>
      
      <!-- Panel Seams -->
      <!-- Center vertical seam -->
      <path d="M 0,-265 Q 0,-175 0,-85" fill="none" stroke="#C5C7C1" stroke-width="2.5"/>
      <!-- Left diagonal seam -->
      <path d="M 0,-265 Q -65,-180 -105,-95" fill="none" stroke="#C5C7C1" stroke-width="2"/>
      <!-- Right diagonal seam -->
      <path d="M 0,-265 Q 65,-180 105,-95" fill="none" stroke="#C5C7C1" stroke-width="2"/>

      <!-- Top Squatchee (Button on top of cap) -->
      <ellipse cx="0" cy="-265" rx="14" ry="7" fill="#FFFFFF" stroke="#B8BAB4" stroke-width="2"/>

      <!-- Cap Brim / Visor (Curved Forward) -->
      <path d="M -142,-80 C -120,-115 120,-115 142,-80 C 125,-30 40,-25 0,-25 C -40,-25 -125,-30 -142,-80 Z" fill="url(#capBrimGrad)" stroke="#BFC2BC" stroke-width="2"/>
      <!-- Brim Under-curve 3D thickness lip -->
      <path d="M -140,-78 C -115,-35 -40,-25 0,-25 C 40,-25 115,-35 140,-78 C 115,-45 40,-35 0,-35 C -40,-35 -115,-45 -140,-78 Z" fill="#A4A8A0"/>
      <!-- Brim stitched edge detail -->
      <path d="M -128,-75 C -105,-40 -35,-32 0,-32 C 35,-32 105,-40 128,-75" fill="none" stroke="#E6E8E3" stroke-width="2" stroke-dasharray="6,4"/>
    </g>

  </g>
</svg>
